# Fase 3 v2 ablacion: modelo ~50M
# hidden 384, layers 6, heads 6, ff_mult 4 + weight_tying para mantener ~60M params.
job:
  name: f0-span-v2-50m
  partition: sixhour
  gres: gpu:pro6000:1
  cpus: 16
  mem: 80G
  time: "05:50:00"
  overlay: /beegfs/a474r867/ecoreasoner/blackwell-torch.overlay
  venv: /bb/bwvenv/bin/python
  output: /beegfs/a474r867/ecoreasoner/runs/f0-span-v2-50m/job-%j.out

model:
  vocab: 126080
  hidden: 384
  layers: 6
  heads: 6
  ff_mult: 4
  seq_len: 768
  n_experts: 1
  k: 1
  use_rope: false
  weight_tying: true

train:
  mask_type: span
  mask_p: 0.15
  mask_schedule: uniform
  mask_schedule_args: '{"b_l": 0.05, "b_h": 0.95}'
  span_len: 64
  whole_stage: true
  data_cache: /beegfs/a474r867/ecoreasoner/data/train_ids_skeleton_v2.npz
  lr: 2.0e-4
  lr_decay: cosine
  lr_min_ratio: 0.1
  warmup: 200
  grad_clip: 1.0
  ema_decay: 0.0

eval:
  mask_p: 0.15
  n_pairs: 256
  temp: 1.0
  steps: 8
  max_new: 128
  batch: 8

out:
  dir: /beegfs/a474r867/ecoreasoner/runs
  tag: f0-span-v2-50m

seed: 7331
