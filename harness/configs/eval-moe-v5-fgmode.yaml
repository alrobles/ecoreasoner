# eval-moe-v5-fgmode.yaml — config de EVAL para el brazo fine-grained MoE (fgmode)
# (runs/v5-1b-fgmode): 32 expertos finos @ff/2 top-2 + 1 shared @ff/4,
# ~mismo FLOPs ruteado y params totales que v5-1b (ver ROADMAP §A2).
# Mismo bloque eval/train que eval-moe-v5 -> comparable directo.

job:
  name: eval-moe-v5-fgmode
  partition: sixhour
  gres: gpu:1
  cpus: 8
  mem: 40G
  time: "00:50:00"

model:
  vocab: 126080
  hidden: 768
  layers: 12
  heads: 12
  ff_mult: 4
  seq_len: 768
  n_experts: 32
  k: 2
  n_shared: 1
  shared_ff_div: 4
  fine_ff_div: 2
  use_rope: false
  weight_tying: false

train:
  mask_type: span
  mask_p: 0.15
  mask_schedule: uniform
  span_len: 64
  curriculum: 0
  whole_stage: true
  lr: 2.0e-4
  lr_decay: cosine
  lr_min_ratio: 0.1
  warmup: 200
  grad_clip: 1.0
  ema_decay: 0.0

eval:
  mask_p: 0.15
  n_pairs: 256
  temp: 1.0
  steps: 8
  max_new: 128
  batch: 8

out:
  dir: /beegfs/a474r867/ecoreasoner/runs
  tag: eval-moe-v5-fgmode

seed: 7331
