# run.yaml — V3.2 role/conective-aware masking.
# Extiende f0-span-v3-curriculum: curriculum de masking + role_mask.
# El curriculum fija span_len/b_h por step; role_mask decide donde colocar los
# spans priorizando conectivas, verbos de relacion, numeros y entidades.

job:
  name: f0-span-v3-role
  partition: sixhour
  gres: gpu:pro6000:1
  cpus: 16
  mem: 80G
  time: "05:50:00"
  overlay: /beegfs/a474r867/ecoreasoner/blackwell-torch.overlay
  venv: /bb/bwvenv/bin/python
  output: /beegfs/a474r867/ecoreasoner/runs/f0-span-v3-role/job-%j.out

model:
  vocab: 126080
  hidden: 512
  layers: 8
  heads: 8
  ff_mult: 4
  seq_len: 768
  n_experts: 1
  k: 1
  use_rope: false
  weight_tying: false

train:
  mask_type: span
  mask_p: 0.15
  mask_schedule: uniform
  mask_schedule_args: '{"b_l": 0.05, "b_h": 0.95}'
  span_len: 64
  curriculum: 1
  cur_stages: '[[0,2000,16,0.30],[2000,5000,32,0.60],[5000,10000,64,0.95]]'
  role_mask: 1
  role_config: '{"connectives":["because","despite","however","therefore","although","thus","since","while","whereas","yet","but","so","if"],"relation_verbs":["increases","reduces","decreases","inhibits","promotes","correlates","depends","drives","affects","influences","regulates","enhances","suppresses","causes","leads","results","associated","linked","modulates","triggers"],"species_keywords":["panthera","quercus","apis","daphnia","mytilus","giraffa","cervus","populus","saguaro","tigris","ilex","suber"],"number_weight":2.0,"connective_weight":3.0,"relation_weight":3.0,"entity_weight":2.0,"uppercase_bonus":0.5}'
  target_steps: 10000
  whole_stage: true
  data_cache: /beegfs/a474r867/ecoreasoner/data/train_ids_skeleton_v2.npz
  lr: 2.0e-4
  lr_decay: cosine
  lr_min_ratio: 0.1
  warmup: 200
  grad_clip: 1.0
  ema_decay: 0.0

eval:
  mask_p: 0.15
  n_pairs: 256
  temp: 1.0
  steps: 8
  max_new: 128
  batch: 8

out:
  dir: /beegfs/a474r867/ecoreasoner/runs
  tag: f0-span-v3-role

seed: 7331
